<text x="150" y="658.0" font-size="12" fill="#1E293B" font-weight="normal" text-anchor="middle" dominant-baseline="central">Human: in the customer&#x27;s favor</text>
<rect x="535.0" y="625.0" width="230" height="50" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
<text x="650" y="642.0" font-size="12" fill="#1E293B" font-weight="normal" text-anchor="middle" dominant-baseline="central">Rejected</text>
<text x="650" y="658.0" font-size="12" fill="#1E293B" font-weight="normal" text-anchor="middle" dominant-baseline="central">Human: claim not upheld</text>
<polyline points="275.0,550 150,550 150,625.0" fill="none" stroke="#64748B" stroke-width="1.4" marker-end="url(#arrow)"/>
<polyline points="525.0,550 650,550 650,625.0" fill="none" stroke="#64748B" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="158" y="591.5" font-size="11" fill="#475569" font-weight="normal" text-anchor="start" dominant-baseline="central">upheld</text>
<text x="658" y="591.5" font-size="11" fill="#475569" font-weight="normal" text-anchor="start" dominant-baseline="central">not upheld</text>
<rect x="285.0" y="725.0" width="230" height="50" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
<text x="400" y="742.0" font-size="12" fill="#1E293B" font-weight="normal" text-anchor="middle" dominant-baseline="central">Closed</text>
<text x="400" y="758.0" font-size="12" fill="#1E293B" font-weight="normal" text-anchor="middle" dominant-baseline="central">Human: customer notified</text>
<polyline points="150,675.0 150,700 340,700 340,725.0" fill="none" stroke="#64748B" stroke-width="1.4" marker-end="url(#arrow)"/>
<polyline points="650,675.0 650,700 460,700 460,725.0" fill="none" stroke="#64748B" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="285.0" y="830.0" width="230" height="40" rx="20.0" fill="#1E293B" stroke="#1E293B" stroke-width="1.5"/>
<text x="400" y="850.0" font-size="12" fill="#FFFFFF" font-weight="normal" text-anchor="middle" dominant-baseline="central">End</text>
<polyline points="400,775.0 400,830" fill="none" stroke="#64748B" stroke-width="1.4" marker-end="url(#arrow)"/>
<polyline points="880,375.0 880,850 515.0,850" fill="none" stroke="#64748B" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="35.0" y="922" width="16" height="16" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="57.0" y="930.0" font-size="11.5" fill="#1E293B" font-weight="normal" text-anchor="start" dominant-baseline="central">System creates case</text>
<rect x="225.6" y="922" width="16" height="16" rx="3" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.5"/>
<text x="247.6" y="930.0" font-size="11.5" fill="#1E293B" font-weight="normal" text-anchor="start" dominant-baseline="central">System hands off</text>
<rect x="394.0" y="922" width="16" height="16" rx="3" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="416.0" y="930.0" font-size="11.5" fill="#1E293B" font-weight="normal" text-anchor="start" dominant-baseline="central">No case</text>
<rect x="495.8" y="922" width="16" height="16" rx="3" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
<text x="517.8" y="930.0" font-size="11.5" fill="#1E293B" font-weight="normal" text-anchor="start" dominant-baseline="central">Human only</text>
