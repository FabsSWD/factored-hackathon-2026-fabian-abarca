<polyline points="400,375.0 400,425.0" fill="none" stroke="#64748B" stroke-width="1.4" marker-end="url(#arrow)"/>
<polygon points="400,514.0 525.0,550 400,586.0 275.0,550" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
