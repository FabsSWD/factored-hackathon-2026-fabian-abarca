<text x="150" y="358.0" font-size="12" fill="#1E293B" font-weight="normal" text-anchor="middle" dominant-baseline="central">System: ACT-02 verified</text>
<rect x="285.0" y="325.0" width="230" height="50" rx="6" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.5"/>
<text x="400" y="342.0" font-size="12" fill="#1E293B" font-weight="bold" text-anchor="middle" dominant-baseline="central">Escalated</text>
<text x="400" y="358.0" font-size="12" fill="#1E293B" font-weight="normal" text-anchor="middle" dominant-baseline="central">System: ACT-05 handoff</text>
<rect x="785.0" y="325.0" width="190" height="50" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="880" y="342.0" font-size="12" fill="#1E293B" font-weight="bold" text-anchor="middle" dominant-baseline="central">No case</text>
<text x="880" y="358.0" font-size="12" fill="#1E293B" font-weight="normal" text-anchor="middle" dominant-baseline="central">INFORM or REFUSE</text>
<polyline points="275.0,250 150,250 150,325.0" fill="none" stroke="#64748B" stroke-width="1.4" marker-end="url(#arrow)"/>
<polyline points="400,286.0 400,325.0" fill="none" stroke="#64748B" stroke-width="1.4" marker-end="url(#arrow)"/>
<polyline points="525.0,250 880,250 880,325.0" fill="none" stroke="#64748B" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="158" y="291.5" font-size="11" fill="#475569" font-weight="normal" text-anchor="start" dominant-baseline="central">RESOLVE</text>
<text x="408" y="301.5" font-size="11" fill="#475569" font-weight="normal" text-anchor="start" dominant-baseline="central">ESCALATE</text>
<text x="888" y="291.5" font-size="11" fill="#475569" font-weight="normal" text-anchor="start" dominant-baseline="central">INFORM / REFUSE</text>
<rect x="285.0" y="425.0" width="230" height="50" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
<text x="400" y="442.0" font-size="12" fill="#1E293B" font-weight="normal" text-anchor="middle" dominant-baseline="central">In Process</text>
