<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="980" viewBox="0 0 1010 980" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Dispute case lifecycle">
<title>Dispute case lifecycle</title>
<defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#64748B'/></marker></defs>
<rect width="1010" height="980" fill="#FFFFFF"/>
<rect x="285.0" y="30.0" width="230" height="40" rx="20.0" fill="#1E293B" stroke="#1E293B" stroke-width="1.5"/>
<text x="400" y="50.0" font-size="12" fill="#FFFFFF" font-weight="normal" text-anchor="middle" dominant-baseline="central">Start: dispute raised</text>
<rect x="285.0" y="125.0" width="230" height="50" rx="6" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
