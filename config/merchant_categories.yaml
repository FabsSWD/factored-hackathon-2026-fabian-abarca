# Words a customer uses for a kind of business, mapped to transactions.merchant_category
# (GATE-05, policy §5). A merchant the customer names only with such words ("un restaurante",
# "una farmacia") is searched by its category. Generic words without a category ("tienda",
# "loja", "un lugar") leave the merchant out of the search: "tienda" alone is ambiguous in the
# data (Tienda Don José is Food, Tienda General is Other).
#
# Words are compared case- and accent-insensitively; a word belongs to one category only.
# The categories are the values of the data (Food, Health, Transport, Entertainment,
# Services, Other); about 5% of purchases have none and are never found by category.
#
# Withdrawal, Deposit and Transfer are not merchant categories but transaction types: an ATM or
# a deposit has no merchant in the data, so "un retiro en un cajero" or "un depósito" (when the
# model gives it as the merchant) is compared with transactions.transaction_type instead
# (app.policy.matching, TRANSACTION_TYPE_CATEGORIES).

categories:
  Food:
    - restaurante
    - restaurant
    - comida
    - almuerzo
    - cena
    - desayuno
    - supermercado
    - mercado
    - panaderia
    - cafeteria
    - lanchonete
    - padaria
    - almoco
    - jantar
  Health:
    - farmacia
    - drogueria
    - clinica
    - hospital
    - medico
    - laboratorio
    - optica
    - otica
    - consultorio
  Transport:
    - gasolinera
    - gasolina
    - combustible
    - combustivel
    - taxi
    - transporte
    - posto
  Entertainment:
    - cine
    - cinema
    - teatro
    - concierto
    - show
    - streaming
    - entretenimiento
    - ingresso
  Services:
    - telefono
    - telefonica
    - telefone
    - celular
    - internet
    - cable
    - servicios
    - servicos
  Other:
