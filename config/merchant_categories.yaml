    - ropa
    - roupa
    - ferreteria
  Withdrawal:
    - cajero
    - cajeros
    - atm
    - caixa
    - autoservicio
    - automatico
    - eletronico
    - retiro
    - retiros
    - saque
    - saques
  Deposit:
    - deposito
    - depositos
    - consignacion
  Transfer:
    - transferencia
    - transferencias
