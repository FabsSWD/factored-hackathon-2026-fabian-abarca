[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dispute-intake"
version = "0.1.0"
description = "Transaction-dispute intake for a synthetic bank (Factored Hackathon 2026)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "tenacity>=9.0",
    "pydantic-settings>=2.4",
    "duckdb>=1.1",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    # Starlette 1.7 TestClient: httpx support is deprecated in favour of httpx2 (tests only).
    "httpx2>=2.13",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-markers"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF"]
# SIM300 misreads "actual == expected" assertions on constants as Yoda conditions.
ignore = ["SIM300"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "migrations", "scripts/load_core_banking.py", "scripts/m1_reconciliation.py", "scripts/llm_smoke.py", "scripts/bootstrap_db.py", "scripts/smoke_stack.py", "docker/kev/entrypoint.py"]
explicit_package_bases = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
